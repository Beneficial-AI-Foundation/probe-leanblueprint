[package]
name = "probe-leanblueprint"
version = "0.3.0"
edition = "2021"
description = "Enrich probe-lean atoms with Lean blueprint progress metadata (leanblueprint + Verso Blueprint)"
license = "MIT"
repository = "https://github.com/Beneficial-AI-Foundation/probe-leanblueprint"
keywords = ["lean", "blueprint", "leanblueprint", "verso", "call-graph"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "probe_leanblueprint"
path = "src/lib.rs"

[[bin]]
name = "probe-leanblueprint"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
# Git dependency on the probe hub, pinned for reproducibility (matches the rest
# of the published ecosystem, e.g. probe-aeneas). For local development against
# uncommitted hub changes, add a `[patch]` pointing `probe` at `../probe`.
probe = { git = "https://github.com/Beneficial-AI-Foundation/probe", rev = "80555cc0f3ac2f63a18922fcf4b62cdd8fcfa4d5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Runtime dep: the Massot adapter materializes the bundled emitter to a temp
# file when it is not shipped alongside the binary.
tempfile = "3"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dist]
inherits = "release"
